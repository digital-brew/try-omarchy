# Architecture-specific companion to the pinned Quattro pacman configuration.
# Arch Linux ARM supplies core/extra/alarm/aur. Omarchy's channel repositories
# do not publish ARM packages, but its unchannelled aarch64 repository provides
# the architecture-independent keyring package required by the factory build.
[options]
Color
ILoveCandy
VerbosePkgLists
HoldPkg = pacman glibc
# QEMU direct-boots the kernel and initramfs paired with this VM disk. Keep its
# installed modules and DKMS headers on that exact ABI. Hyprland is likewise
# held until upstream includes our rounded-border coverage backport; otherwise
# a routine full-system update can silently restore the defect. Hold the
# reviewed aquamarine/Hyprtoolkit pair too: later ALARM builds may require a
# different libaquamarine.so and abort the updater with mixed ABI requirements.
IgnorePkg = linux-aarch64 linux-aarch64-headers hyprland aquamarine hyprtoolkit
Architecture = auto
CheckSpace
ParallelDownloads = 5
DownloadUser = alpm
SigLevel = Required DatabaseOptional
LocalFileSigLevel = Optional

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

[alarm]
Include = /etc/pacman.d/mirrorlist

[aur]
Include = /etc/pacman.d/mirrorlist

# Omarchy's aarch64 packages live on the edge channel (the stable index holds
# only the keyring). Sync-only: nothing is selected or upgraded from here
# implicitly; the factory and omarchy-pkg-add name repo/package explicitly, so
# the pinned Hyprland stack cannot be replaced by the edge builds.
[omarchy]
Usage = Sync
SigLevel = Required DatabaseOptional
Server = https://pkgs.omarchy.org/edge/$arch

# Apple Silicon builds published by the omarchy-mac project (Ghostty, Obsidian,
# Brave, ...). Unsigned upstream, so it is sync-only and opt-in: packages are
# installed only when named explicitly through the Install menu resolver.
[omarchy-aarch64]
Usage = Sync
SigLevel = Optional TrustAll
Server = https://github.com/omarchy-mac/omarchy-pkgs-aarch64/releases/download/edge
